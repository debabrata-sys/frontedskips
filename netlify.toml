[build]
  command = "cross-env GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true CI=false NODE_OPTIONS=--max-old-space-size=1536 react-scripts build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"
  GENERATE_SOURCEMAP = "false"
  DISABLE_ESLINT_PLUGIN = "true"
  CI = "false"
  NODE_OPTIONS = "--max-old-space-size=1536"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
